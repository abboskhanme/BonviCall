# BonviCall. Ports deliberately do not collide with BonviZvonki
# (which uses 5180 / 8010 / 5433) so both can run on one machine.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5443:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./server
    env_file: [.env]
    ports: ["8020:8000"]
    volumes:
      - ./server:/app
      - ./contract:/contract
      # Read-only, and only so `test_compose_wiring.py` can assert that every
      # storage root this app writes to is on a volume. That test exists
      # because `/data/releases` was not, and the symptom was a published APK
      # that 404'd after the next `compose up`.
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      # Same reason, for the deployment file: the lines that keep the database
      # off the network and the app off root are asserted rather than reviewed.
      - ./docker-compose.prod.yml:/compose/docker-compose.prod.yml:ro
      - audio:/data/audio
      # The published APKs (LocalFsReleaseStore, /data/releases). It had NO
      # volume, so every build an admin uploaded lived in the container's
      # writable layer: the row survived in Postgres, the bytes did not, and
      # the next `compose up` left the install page offering a 404 to every
      # salesperson. Separate from `audio` deliberately — audio is customer
      # data under a retention sweep, a release is an artefact that sweep must
      # never be able to eat (core/storage.py says so; nothing mounted it).
      - releases:/data/releases
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # The comment below said reload MUST poll and nothing made it. WatchFiles
      # was left on inotify, which a Docker bind mount does not deliver on
      # macOS (virtiofs) OR on Windows — so `--reload` silently did nothing and
      # an edited file kept serving the old code until somebody restarted the
      # container. Found 2026-09-12 by a landing-page change that "did not
      # work" and was in fact never loaded.
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "1000"
    # macOS + Docker: virtiofs does not forward inotify events, so reload
    # MUST poll. Do not remove --reload-dir; raise the interval if it is noisy.
    command: >
      uvicorn src.main:app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src

  # The scheduler (T150, SPEC §10.4). Its own container, not a thread inside
  # the API: a job that deletes audio must not be able to take a request
  # worker down with it, and restarting the API must not skip a nightly run.
  # Two of these may run at once — every job takes a PostgreSQL advisory lock.
  worker:
    build: ./server
    env_file: [.env]
    volumes:
      - ./server:/app
      - audio:/data/audio
    depends_on:
      postgres: {condition: service_healthy}
    command: python -m src.worker

  panel:
    build: ./panel
    env_file: [.env]
    ports: ["5190:5173"]
    volumes:
      - ./panel:/app
      - /app/node_modules
    environment:
      # Same reason as above — virtiofs has no inotify.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    depends_on: [backend]
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  audio:
  releases:
